# Build and publish a release of LM_LabelingTool for BOTH supported
# platforms -- Windows and Linux (.deb) -- from a single tag.
#
# Windows verification -- the test suite, the launch smoke test, the
# install / zip update / uninstall smoke test -- runs locally before
# tagging:
#
#   powershell -File packaging\ci\local-build.ps1 -Venv C:\lt\venv
#
# A CI round used to take 18-25 minutes and every failed check cost another
# round; see docs/RELEASING.md. What stays in the Windows job here is what a
# release cannot do without, plus one 15-second selftest so a broken bundle
# is never published.
#
# Linux's install and zip-update smoke tests run both here and locally
# (packaging/ci/local-build.sh, which mirrors this job's checks one for
# one) -- that is why build-linux carries more verification steps than
# build-windows.
#
# The Linux job pins `ubuntu-22.04`, NOT `ubuntu-latest`. glibc only works
# forwards: a binary linked against a newer glibc (24.04/noble ships 2.39)
# cannot run on an older one (22.04/jammy ships 2.35), but the reverse
# works. We support both releases, so we must build on the OLDER one. A
# casual bump to `ubuntu-latest` (which tracks the newest LTS) would still
# "work" in CI and would silently drop every user still on 22.04 -- the
# 24.04 cross-validation step in build-linux exists to catch exactly that
# class of mistake before it ships.
#
# Each platform publishes exactly two assets: the one full package a user
# installs by hand (Setup exe / deb) and the app-layer update zip the
# installed app applies to itself. The release page is generated from the
# tag's annotation, which must be Korean (packaging/release_notes.py).
#
# Triggers: a version tag (v*) builds and publishes both platforms. A
# manual run builds with fast compression and uploads the packages and
# zips as workflow artifacts only -- a dry run of the release job's input.
# Tick release_compression on a manual run to rehearse a tag exactly:
# release compression on both platforms, and the asset size ceilings
# enforced -- still without publishing anything.
name: release

on:
  workflow_dispatch:
    inputs:
      release_compression:
        description: "Compress like a release and enforce the asset size ceilings (slower)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # "true" on a tag, or on a manual run that asked for it. Every compression
  # switch and asset size ceiling below keys off this one variable: dry runs
  # used to compress fast and skip the ceilings, so v2.0.0's real runtime
  # deb size was first measured by the tag itself -- and failed (CI run
  # 36965987450).
  LT_RELEASE_COMPRESSION: ${{ github.ref_type == 'tag' || inputs.release_compression }}

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # No fetch-tags: on a tag push it makes checkout fetch the tag twice
          # ("Cannot fetch both <sha> and refs/tags/<tag>"); the steps that
          # read the annotation fetch the real tag themselves.

      - uses: actions/setup-python@v5
        with:
          # Exact: the interpreter and its DLLs are part of the runtime layer.
          python-version: "3.12.10"
          # Keep pip's download cache (torch alone is 2.5 GB) between
          # releases. Keyed on the lock, so a dependency change starts clean;
          # the venv itself is still created fresh every time.
          cache: pip
          cache-dependency-path: |
            packaging/build-lock.txt
            packaging/build-constraints.txt
            requirements.txt
            requirements-dev.txt

      - name: Version
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+(\.\d+)*$') {
              throw "tag '$($env:GITHUB_REF_NAME)' does not match ^v\d+(\.\d+)*$ (e.g. a '-rc1' suffix breaks VersionInfoVersion and is misclassified as a dev build)"
            }
            $ver = $env:GITHUB_REF_NAME
          } else {
            $ver = "dev-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          "LT_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create a clean build environment
        run: |
          # A fresh venv, never the runner's own Python: that one ships with
          # preinstalled packages (filelock, packaging, argcomplete, ...)
          # whose versions follow the runner image, and PyInstaller bundles
          # them -- which moved the runtime id between two builds of the same
          # commit. Everything else is pinned by packaging/build-lock.txt.
          python -m venv "$env:RUNNER_TEMP\buildenv"
          "$env:RUNNER_TEMP\buildenv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install dependencies
        env:
          SAM2_BUILD_CUDA: "0"
          # sam2's repo has symlinks (sam2/sam2_hiera_*.yaml). Without this,
          # git on a machine that defaults core.symlinks=false writes 30-byte
          # placeholder files instead, and the runtime id differs from a
          # build that resolved them. Set explicitly on both sides.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.symlinks
          GIT_CONFIG_VALUE_0: "true"
        run: |
          # Every step below uses the venv (it is first on PATH now).
          if (-not ((Get-Command python).Source -like "$env:RUNNER_TEMP\buildenv\*")) { throw "not running in the build venv" }
          # Whole-array splats only: `pip install @lock -r x` would pass a
          # literal "@lock" (see the ISCC step).
          $lock = @("-m", "pip", "install", "-c", "packaging/build-constraints.txt", "-c", "packaging/build-lock.txt")
          $pipArgs = $lock + @("-r", "requirements-dev.txt", "pyinstaller==6.22.3")
          python @pipArgs
          if ($LASTEXITCODE -ne 0) { throw "installing the production dependencies failed" }
          $pipArgs = $lock + @("torch==2.5.1", "torchvision==0.20.1", "--index-url", "https://download.pytorch.org/whl/cu124")
          python @pipArgs
          if ($LASTEXITCODE -ne 0) { throw "installing torch failed" }
          # sam2's build needs the torch installed above (no CUDA extension: SAM2_BUILD_CUDA=0)
          $pipArgs = $lock + @("--no-build-isolation", "git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4")
          python @pipArgs
          if ($LASTEXITCODE -ne 0) { throw "installing sam2 failed" }

      - name: Build exe
        run: pyinstaller --noconfirm --log-level WARN packaging/labeling_tool.spec

      - name: Selftest packaged exe
        run: |
          # The one check kept in CI: 15 seconds, and it stops a bundle that
          # cannot import torch or compose the sam2 config from being published.
          . packaging/ci/bounded.ps1
          $code = Invoke-Bounded -Path dist\LM_LabelingTool\LM_LabelingTool.exe `
            -CallArgs @("--selftest=full") -TimeoutSec 300 -What "selftest on the build output"
          if (Test-Path dist\LM_LabelingTool\selftest.log) {
            Get-Content dist\LM_LabelingTool\selftest.log
            Remove-Item dist\LM_LabelingTool\selftest.log
          } else {
            Write-Host "selftest.log not found (early crash?)"
          }
          if ($code -ne 0) { throw "selftest failed with exit code $code" }
          # the app may create these next to the exe; never ship them
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist\LM_LabelingTool\data, dist\LM_LabelingTool\config.json

      - name: Compute the runtime id and write build info
        run: |
          # The runtime id measures the runtime layer itself -- each file's
          # path and size, minus the build machine's own system DLLs. It must
          # match what local-build.ps1 printed for the same commit; if it
          # does not, the lock or the environment has drifted.
          $rt = python packaging/layers.py runtime-id dist/LM_LabelingTool
          if (-not ($rt -match '^r[0-9a-f]{8}$')) { throw "bad runtime id: $rt" }
          "LT_RUNTIME=$rt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "runtime id: $rt"
          # What the id hashes, file by file, for diffing against a local build.
          New-Item -ItemType Directory -Force diag | Out-Null
          python packaging/layers.py manifest dist/LM_LabelingTool | Set-Content -Path diag\runtime-manifest.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "could not write the runtime manifest" }
          $ver = $env:LT_VERSION -replace '^v', ''
          $info = @{ version = $ver; variant = 'full'; runtime = $rt; commit = $env:GITHUB_SHA.Substring(0,7) }
          $info | ConvertTo-Json -Compress | Set-Content -Path dist\LM_LabelingTool\build-info.json -Encoding utf8
          Get-Content dist\LM_LabelingTool\build-info.json

      - name: Stage the app layer
        run: |
          python packaging/layers.py stage dist/LM_LabelingTool dist/app-layer
          if ($LASTEXITCODE -ne 0) { throw "staging the app layer failed" }
          $app = (Get-ChildItem dist/app-layer -Recurse -File | Measure-Object -Property Length -Sum)
          Write-Host ("app layer: {0:N1} MB in {1} files" -f ($app.Sum/1MB), $app.Count)
          # The update zip is what every routine update downloads. If it
          # climbs back into the tens of MB something leaked out of the
          # runtime layer.
          if ($app.Sum -gt 20MB) { throw ("app layer unexpectedly large: {0:N1} MB" -f ($app.Sum/1MB)) }

      - name: Build the update zip
        run: |
          # The app layer plus a manifest of every file's SHA-256, named for
          # the runtime id it was built against (checker.update_asset_name):
          # an installed app on that runtime applies it in place.
          $ver = $env:LT_VERSION -replace '^v', ''
          python packaging/update_zip.py dist/app-layer out $ver $env:LT_RUNTIME win32
          if ($LASTEXITCODE -ne 0) { throw "update zip failed" }

      - name: Reuse the previous full installer if the runtime is unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compressing the full installer is ~11 of ~18 minutes, and on a
          # code-only release its runtime layer is byte-identical to the
          # previous release's. Ship that installer again under this
          # version's name; new users get the update zip on first launch.
          # See packaging/reuse_full.py for why the name must be ours.
          New-Item -ItemType Directory -Force diag, prev | Out-Null
          $ErrorActionPreference = "Continue"
          gh release view --repo $env:GITHUB_REPOSITORY --json tagName,assets | Set-Content -Path diag\prev-release.json -Encoding utf8
          $found = $LASTEXITCODE -eq 0
          $ErrorActionPreference = "Stop"
          if (-not $found) { Write-Host "no previous release: full build"; exit 0 }
          $plan = python packaging/reuse_full.py plan diag\prev-release.json $env:LT_RUNTIME
          if ($LASTEXITCODE -ne 0) { throw "reuse_full.py plan failed" }
          if (-not $plan) { Write-Host "runtime $env:LT_RUNTIME is new: full build"; exit 0 }
          $prevTag, $prevName = $plan -split "`t"
          gh release download $prevTag --repo $env:GITHUB_REPOSITORY --dir prev --pattern $prevName --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "could not download $prevName from $prevTag" }
          python packaging/reuse_full.py verify prev\SHA256SUMS.txt "prev\$prevName"
          if ($LASTEXITCODE -ne 0) { throw "$prevName from $prevTag does not match its published checksum" }
          "LT_REUSE_FULL=$PWD\prev\$prevName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "runtime $env:LT_RUNTIME unchanged since ${prevTag}, reusing $prevName"

      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found even after installing Inno Setup" }
          $ver = $env:LT_VERSION -replace '^v', ''
          # Windows version resources must be numeric (x.y[.z[.w]]). For dev
          # builds ($ver like "dev-a72cd7b"), use 0.0.0.
          if ($ver -match '^\d+(\.\d+)*$') { $infoVer = $ver } else { $infoVer = '0.0.0' }
          New-Item -ItemType Directory -Force out | Out-Null
          # Splatting only expands when it IS the whole argument list --
          # `& $iscc /A @fast script.iss` passes a literal "@fast", which
          # ISCC reads as a second script filename and rejects.
          $common = @("/DMyVersion=$ver", "/DMyVersionInfo=$infoVer",
                      "/DMySourceRoot=$PWD")
          # Tags are what users download: maximum compression. A manual dry
          # run only needs to show that the release would build, unless it
          # asked to rehearse the release compression.
          if ($env:LT_RELEASE_COMPRESSION -ne 'true') {
            $common += "/DMyFast=1"
            Write-Host "dry run: fast compression"
          }
          # MySource/MyOutDir must be absolute: Inno resolves relative paths
          # against the .iss file's own directory (packaging\).
          if ($env:LT_REUSE_FULL) {
            # Same runtime layer as the previous release: its installer, under
            # the name clients look for in THIS release.
            Copy-Item $env:LT_REUSE_FULL "out\LM_LabelingTool-Setup-v$ver.exe"
            Write-Host "full installer reused: $(Split-Path $env:LT_REUSE_FULL -Leaf)"
          } else {
            $isccArgs = @("/DMySource=$PWD\dist\LM_LabelingTool",
                          "/DMyOutDir=$PWD\out") + $common + @("packaging\installer.iss")
            & $iscc @isccArgs
            if ($LASTEXITCODE -ne 0) { throw "full installer failed ($LASTEXITCODE)" }
          }
          $full = Get-ChildItem out\LM_LabelingTool-Setup-*.exe | Select-Object -First 1
          if (-not $full) { throw "ISCC produced no full installer" }
          Get-ChildItem out\*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB) }
          # GitHub release assets must stay below 2 GiB. Checked whenever the
          # release compression is used: on a tag, or a rehearsal of one.
          if ($env:LT_RELEASE_COMPRESSION -eq 'true' -and $full.Length -ge 1.9GB) {
            throw "installer too large for a release asset: $($full.Length) bytes"
          }

      - name: Assert the asset names match what the client looks for
        run: |
          # installer.iss's OutputBaseFilename and checker.py's templates are
          # one contract; change either alone and the client silently stops
          # finding updates.
          $ver = $env:LT_VERSION -replace '^v', ''
          $names = (Get-ChildItem out\*.exe, out\*.zip | ForEach-Object { $_.Name }) -join ","
          python -c "import sys; from labeling_tool.update import checker; ver, rt, names = sys.argv[1], sys.argv[2], set(sys.argv[3].split(',')); [sys.exit(f'{w!r} not in {sorted(names)}') for w in (checker.full_asset_name(ver, checker.WINDOWS), checker.update_asset_name(ver, rt, checker.WINDOWS)) if w not in names]; print('asset names agree with checker.py')" $ver $env:LT_RUNTIME $names
          if ($LASTEXITCODE -ne 0) { throw "asset names do not match checker.py" }

      - name: Checksums
        run: |
          # the installer and the zip both get a published checksum: the
          # updater refuses any asset it cannot verify
          Get-ChildItem out\*.exe, out\*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content -Path "out\SHA256SUMS.txt" -Encoding ascii
          }
          Get-Content out\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LM_LabelingTool-${{ env.LT_VERSION }}
          path: out/*
          compression-level: 0

      # Diagnostics only. Kept out of the artifact above because the release
      # job publishes everything named LM_LabelingTool-*.
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-manifest-${{ env.LT_VERSION }}
          path: diag/runtime-manifest.txt

  build-linux:
    # See the top-of-file comment: pinned to the OLDER of our two supported
    # Ubuntu releases on purpose, never ubuntu-latest.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # No fetch-tags: on a tag push it makes checkout fetch the tag twice
          # ("Cannot fetch both <sha> and refs/tags/<tag>"); the steps that
          # read the annotation fetch the real tag themselves.

      - uses: actions/setup-python@v5
        with:
          # Exact: the interpreter and its DLLs are part of the runtime layer.
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            packaging/build-lock-linux.txt
            packaging/build-constraints.txt
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: |
          # dpkg-dev: dpkg-deb, used to build the .deb package.
          # xvfb: runs the Qt GUI headless for the selftest below.
          # build-essential: a C compiler, for any pinned package that has
          #   no prebuilt manylinux wheel.
          #
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev xvfb build-essential

          # RUNTIME_DEPENDS must be present AT BUILD TIME, even though the
          # deb only declares it for install time. PyInstaller resolves the
          # Qt plugins' shared-library chain by reading the real .so files:
          # without them it logs "Library not found: could not resolve
          # 'libxcb-xinerama.so.0', dependency of libqxcb.so" and ships a
          # bundle whose xcb platform plugin cannot start (CI run
          # 36841286350). The hosted runner image does not carry them.
          #
          # This does NOT make the availability check a tautology: that
          # check moved into a clean container below, because the question
          # it asks -- "does a normal desktop already have these?" -- can
          # only be answered against a desktop baseline, and a CI runner is
          # not one. The sufficiency check stays here, where having the
          # libraries installed is exactly the premise it verifies.
          #
          # `apt-get satisfy` takes Depends syntax verbatim, so the list is
          # derived from deb.py rather than hardcoded a fourth time -- it
          # handles both the version constraint and the jammy/noble glib
          # alternation on its own. BUNDLED_LIBS ride along: they are not
          # declared Depends (a stock desktop lacks them), so the runtime
          # layer only carries them if PyInstaller finds them here.
          depends=$(python -c "import sys; sys.path.insert(0, 'packaging'); import deb; print(', '.join(deb.RUNTIME_DEPENDS + deb.BUNDLED_LIBS))")
          echo "build-time Qt/X11 libraries: $depends"
          sudo apt-get satisfy -y --no-install-recommends "$depends"

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
              echo "tag '$GITHUB_REF_NAME' does not match ^v[0-9]+(\.[0-9]+)*\$ (e.g. a '-rc1' suffix breaks the deb Version field)" >&2
              exit 1
            fi
            ver="$GITHUB_REF_NAME"
            # The tag's annotation becomes the release page's change notes,
            # and they must be Korean. Checked here, before the 30-minute
            # builds, not by the release job after them. actions/checkout
            # leaves a lightweight copy of the tag behind; fetch the real
            # annotated one. A manual run has no tag message to check.
            # Subject and body only: %(contents) of a signed tag also carries
            # its PGP signature. A lightweight tag yields the commit's
            # (English) subject, which the check still rejects.
            git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.txt"
            python packaging/release_notes.py check "$RUNNER_TEMP/notes.txt"
          else
            ver="0.0.0-dev-${GITHUB_SHA:0:7}"
          fi
          echo "LT_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Create a clean build environment
        run: |
          # A fresh venv, never the runner's own Python: preinstalled
          # packages on the runner image would get bundled by PyInstaller
          # and move the runtime id between two builds of the same commit.
          # Everything else is pinned by packaging/build-lock-linux.txt.
          python -m venv "$RUNNER_TEMP/buildenv"
          echo "$RUNNER_TEMP/buildenv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        env:
          SAM2_BUILD_CUDA: "0"
          # sam2's repo has symlinks (sam2/sam2_hiera_*.yaml). Without this,
          # git on a machine that defaults core.symlinks=false writes 30-byte
          # placeholder files instead, and the runtime id differs from a
          # build that resolved them. Set explicitly on both sides.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.symlinks
          GIT_CONFIG_VALUE_0: "true"
        run: |
          set -euo pipefail
          # Every step below uses the venv (it is first on PATH now).
          case "$(command -v python)" in
            "$RUNNER_TEMP"/buildenv/*) ;;
            *) echo "not running in the build venv" >&2; exit 1 ;;
          esac
          lock=(-c packaging/build-constraints.txt -c packaging/build-lock-linux.txt)
          python -m pip install "${lock[@]}" -r requirements-dev.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.7
          python -m pip install "${lock[@]}" torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cu124
          # sam2's build needs the torch installed above (no CUDA extension: SAM2_BUILD_CUDA=0)
          python -m pip install "${lock[@]}" --no-build-isolation "git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4"

      - name: Build exe
        run: pyinstaller --noconfirm --log-level WARN packaging/labeling_tool.spec

      - name: Selftest packaged exe
        run: |
          set -euo pipefail
          set +e
          timeout 300 xvfb-run -a dist/LM_LabelingTool/LM_LabelingTool --selftest=full
          code=$?
          set -e
          # selftest.py logs via user_data_home(), which on Linux is the XDG
          # data dir ($HOME/.local/share/lm-labeling-tool), NOT the build
          # output directory -- that is Windows-only. Reading
          # dist/LM_LabelingTool/selftest.log here always misses, printing a
          # misleading "not found (early crash?)" on every successful build.
          if [ -f "$HOME/.local/share/lm-labeling-tool/selftest.log" ]; then
            cat "$HOME/.local/share/lm-labeling-tool/selftest.log"
            rm -f "$HOME/.local/share/lm-labeling-tool/selftest.log"
          else
            echo "selftest.log not found (early crash?)"
          fi
          if [ "$code" -ne 0 ]; then
            echo "selftest failed with exit code $code" >&2
            exit 1
          fi
          # the app may create these next to the exe; never ship them
          rm -rf dist/LM_LabelingTool/data dist/LM_LabelingTool/config.json

      - name: Compute the runtime id and write build info
        run: |
          set -euo pipefail
          # The runtime id measures the runtime layer itself -- each file's
          # path and size -- the Linux counterpart of the Windows step of
          # the same name. It must match what a build of the same commit
          # prints anywhere else; if it does not, the lock has drifted.
          rt=$(python packaging/layers.py runtime-id dist/LM_LabelingTool)
          if ! [[ "$rt" =~ ^r[0-9a-f]{8}$ ]]; then
            echo "bad runtime id: $rt" >&2
            exit 1
          fi
          echo "LT_RUNTIME=$rt" >> "$GITHUB_ENV"
          echo "runtime id: $rt"
          mkdir -p diag
          python packaging/layers.py manifest dist/LM_LabelingTool > diag/runtime-manifest-linux.txt
          ver="${LT_VERSION#v}"
          printf '{"version": "%s", "variant": "full", "runtime": "%s", "commit": "%s"}' \
            "$ver" "$rt" "${GITHUB_SHA:0:7}" > dist/LM_LabelingTool/build-info.json
          cat dist/LM_LabelingTool/build-info.json

      - name: Stage the app layer
        run: |
          set -euo pipefail
          python packaging/layers.py stage dist/LM_LabelingTool dist/app-layer
          app_bytes=$(find dist/app-layer -type f -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')
          printf 'app layer: %.1f MB\n' "$(awk -v b="$app_bytes" 'BEGIN{print b/1024/1024}')"
          # The update zip is what every routine update downloads. If it
          # climbs back into the tens of MB something leaked out of the
          # runtime layer.
          if [ "$app_bytes" -gt $((20 * 1024 * 1024)) ]; then
            echo "app layer unexpectedly large: $app_bytes bytes" >&2
            exit 1
          fi

      - name: Build the deb and the update zip
        run: |
          set -euo pipefail
          mkdir -p out
          ver="${LT_VERSION#v}"
          if [ "$LT_RELEASE_COMPRESSION" != "true" ]; then
            export LT_FAST=1
            echo "dry run: fast compression"
          fi
          # No XZ_OPT: dpkg-deb ignores it and already compresses on every
          # core (see deb.py's _dpkg_deb_build) -- on a 4-vCPU runner the
          # xz -9 pass is CPU-bound at ~16 minutes, not under-threaded.
          python packaging/deb.py build dist/LM_LabelingTool out "$ver"
          # The app layer plus a manifest of every file's SHA-256, named for
          # the runtime id it was built against (checker.update_asset_name).
          python packaging/update_zip.py dist/app-layer out "$ver" "$LT_RUNTIME" linux
          ls -la out/

      - name: Assert the deb fits in a release asset
        run: |
          set -euo pipefail
          # GitHub release assets must stay below 2 GiB -- the Windows job's
          # counterpart of this check (test_the_size_ceiling_only_binds_on_published_builds).
          # The deb carries the full CUDA wheel set at ~1.8 GB (xz -9; the
          # runtime part alone was 1,895,565,776 bytes in CI run
          # 36969300396), so it is the one Linux asset that could
          # realistically grow into that ceiling. Checked whenever the
          # release compression is used (a tag, or a manual rehearsal): a
          # fast-compressed dry run is legitimately larger for the same bytes.
          ver="${LT_VERSION#v}"
          deb_name=$(python -c "from labeling_tool.update import checker; import sys; print(checker.full_asset_name(sys.argv[1], checker.LINUX))" "$ver")
          deb="out/$deb_name"
          size=$(stat -c%s "$deb")
          echo "$(basename "$deb"): $((size / 1024 / 1024)) MB"
          if [ "$LT_RELEASE_COMPRESSION" = "true" ] && [ "$size" -ge 2040109465 ]; then
            echo "deb too large for a release asset: $size bytes" >&2
            exit 1
          fi

      - name: Assert the asset names match what the client looks for
        run: |
          set -euo pipefail
          # installer.iss / deb.py's filenames and checker.py's templates
          # are one contract; change either alone and the client silently
          # stops finding updates.
          ver="${LT_VERSION#v}"
          names=$(cd out && ls -- *.deb *.zip | paste -sd, -)
          python -c "import sys; from labeling_tool.update import checker; ver, rt, names = sys.argv[1], sys.argv[2], set(sys.argv[3].split(',')); wanted = [checker.full_asset_name(ver, checker.LINUX), checker.update_asset_name(ver, rt, checker.LINUX)]; missing = [w for w in wanted if w not in names]; sys.exit(f'{missing!r} not in {sorted(names)}') if missing else print('asset names agree with checker.py')" "$ver" "$LT_RUNTIME" "$names"

      - name: Start the Ubuntu 24.04 cross-validation in the background
        run: |
          set -euo pipefail
          # "built on 22.04, runs on both" is otherwise only an assumption.
          # noble renamed libglib2.0-0 to libglib2.0-0t64 (64-bit time_t);
          # RUNTIME_DEPENDS covers both names.
          #
          # Started here, collected by "Cross-validate the install on Ubuntu
          # 24.04" below: it needs only the deb, so its ~3.5 minute desktop
          # install overlaps the 22.04 checks instead of following them.
          #
          # The baseline installed below is a stock Ubuntu DESKTOP, not
          # packaging/deb.py RUNTIME_DEPENDS itself -- installing
          # RUNTIME_DEPENDS before dpkg -i would make "no dependency-fixup
          # pass needed" a tautology (install the dependency, then verify
          # the dependency is satisfied). ubuntu-desktop-minimal proves the
          # declared Depends are covered by what a REAL desktop ships, not
          # by us pre-supplying exactly what we declared.
          noble="$RUNNER_TEMP/noble"
          mkdir -p "$noble"
          cat > "$noble/check.sh" <<'EOF'
          apt-get update
          # A desktop metapackage postinst may try to start services; a
          # container has no init system to receive them. This is the
          # standard way to install such packages under plain docker run.
          printf "#!/bin/sh\nexit 101\n" > /usr/sbin/policy-rc.d
          chmod +x /usr/sbin/policy-rc.d
          apt-get install -y ubuntu-desktop-minimal
          apt-get install -y --no-install-recommends xvfb
          dpkg -i /out/lm-labeling-tool_*.deb
          # Bounded: unbounded, this selftest once hung 23 minutes with no
          # output (CI run 36856399327). The selftest arms its own
          # faulthandler dump well inside this limit, so print both of
          # its files -- selftest.log names the check that was running,
          # selftest-hang.txt holds every thread traceback of a hang.
          set +e
          timeout --kill-after=10 300 xvfb-run -a /opt/lm-labeling-tool/LM_LabelingTool --selftest=full
          code=$?
          set -e
          for f in selftest.log selftest-hang.txt; do
            p="$HOME/.local/share/lm-labeling-tool/$f"
            if [ -s "$p" ]; then echo "--- $f"; cat "$p"; fi
          done
          exit "$code"
          EOF
          df -h /
          # setsid + every stream redirected: the step must not wait on a
          # child holding its stdout. The exit code is written to a temp
          # name and renamed, so the collecting step never reads it half
          # written.
          setsid bash -c '
            docker run --rm -v "$PWD/out:/out:ro" -v "$0/check.sh:/check.sh:ro" \
              -e DEBIAN_FRONTEND=noninteractive ubuntu:24.04 bash -euo pipefail /check.sh
            echo $? > "$0/exit.tmp" && mv "$0/exit.tmp" "$0/exit"
          ' "$noble" > "$noble/log" 2>&1 < /dev/null &

      - name: Install smoke test 1/2 -- are the declared dependencies already on this machine?
        run: |
          set -euo pipefail
          # Runs in a clean 22.04 container, NOT on the runner. The runner
          # now has RUNTIME_DEPENDS installed (the build step needs them so
          # PyInstaller can resolve Qt's plugin chain), which would make
          # this assertion a tautology: install the dependency, then verify
          # the dependency is satisfied.
          #
          # The baseline is ubuntu-desktop-minimal -- a metapackage that has
          # nothing to do with us -- because the question is "does a normal
          # desktop already carry what the package declares?". A CI
          # runner is not a desktop, so answering it against the runner was
          # wrong in both directions: it lacks libraries real desktops have,
          # and carries build tooling they do not (CI run 36841286350).
          #
          # dpkg -i must succeed ON ITS OWN: needing apt's dependency-fixup
          # pass afterwards would mean RUNTIME_DEPENDS lists a library real
          # users will not have either.
          docker run --rm -v "$PWD/out:/out:ro" -e DEBIAN_FRONTEND=noninteractive ubuntu:22.04 bash -euo pipefail -c '
            apt-get update
            # No init system under plain `docker run`, so stop maintainer
            # scripts from trying to start services.
            printf "#!/bin/sh\nexit 101\n" > /usr/sbin/policy-rc.d
            chmod +x /usr/sbin/policy-rc.d
            apt-get install -y ubuntu-desktop-minimal
            dpkg -i /out/lm-labeling-tool_*.deb
          '

      - name: Install smoke test 2/2 -- are the declared dependencies enough?
        run: |
          set -euo pipefail
          # A different question from the previous step: dpkg -i succeeding
          # only proves this machine already HAD what RUNTIME_DEPENDS lists.
          # It says nothing about whether that list is actually SUFFICIENT
          # for Qt to start -- a missing-but-undeclared library would still
          # let dpkg -i succeed and only crash here.
          # Remove any stale log first: this is the same XDG path the build
          # step's own "Selftest packaged exe" step just wrote to, and if the
          # installed app crashes before logging, cat'ing a leftover old log
          # here would look like fresh output from the installed app.
          #
          # Install on the runner first: 1/2 installed inside a throwaway
          # container, so nothing it did survives here (CI run 36853951013:
          # "LM_LabelingTool: not found"). The runner already carries
          # RUNTIME_DEPENDS from the build step, so this install is NOT the
          # availability check -- that stays in 1/2's desktop container.
          # The update round trip below also runs against this install.
          sudo dpkg -i out/lm-labeling-tool_*.deb
          rm -f "$HOME/.local/share/lm-labeling-tool/selftest.log"
          set +e
          timeout 300 xvfb-run -a /opt/lm-labeling-tool/LM_LabelingTool --selftest=full
          code=$?
          set -e
          if [ -f "$HOME/.local/share/lm-labeling-tool/selftest.log" ]; then
            cat "$HOME/.local/share/lm-labeling-tool/selftest.log"
          fi
          if [ "$code" -ne 0 ]; then
            echo "installed-app selftest failed with exit code $code -- RUNTIME_DEPENDS is likely missing a library" >&2
            exit 1
          fi
          echo "installed app selftest passed"

      - name: Update round trip -- the installed app applies its own zip
        run: |
          set -euo pipefail
          # The path every routine update takes, run for real: the installed
          # app (as root, as pkexec runs it for a user) verifies and applies
          # this release's zip to /opt. A zip that does not fit the install
          # it was built for -- wrong runtime id, wrong platform, a file
          # outside the app layer -- fails here instead of on users' machines.
          zip=$(ls out/update-v*-linux.zip)
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          # Damage one installed app-layer file, then let the zip repair it.
          # (build-info.json must stay intact: apply_patch reads its runtime id.)
          # A fixed file the --apply-update run never imports: the first .pyc
          # find meets depends on directory order and once was a module app.py
          # imports at startup, so the app could not start to repair itself.
          # The selftest below imports it, proving the zip restored it.
          victim=_internal/labeling_tool/selftest.pyc
          test -f "/opt/lm-labeling-tool/$victim"
          sudo rm "/opt/lm-labeling-tool/$victim"
          timeout 300 sudo /opt/lm-labeling-tool/LM_LabelingTool --apply-update "$zip" --sha256 "$sha"
          test -f "/opt/lm-labeling-tool/$victim"
          test ! -e /opt/lm-labeling-tool/.update-journal
          rm -f "$HOME/.local/share/lm-labeling-tool/selftest.log"
          set +e
          timeout 300 xvfb-run -a /opt/lm-labeling-tool/LM_LabelingTool --selftest=full
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            cat "$HOME/.local/share/lm-labeling-tool/selftest.log" 2>/dev/null || true
            echo "selftest after the zip update failed with exit code $code" >&2
            exit 1
          fi
          echo "zip update applied and the app still passes its selftest"

      - name: Cross-validate the install on Ubuntu 24.04
        run: |
          set -euo pipefail
          # Collects the container started in the background before smoke
          # test 1/2. Bounded: a run on its own took under 4 minutes, so
          # 25 is generous even with the 22.04 container competing for the
          # same CPU and mirror.
          noble="$RUNNER_TEMP/noble"
          if ! timeout 1500 bash -c 'until [ -f "$0/exit" ]; do sleep 5; done' "$noble"; then
            cat "$noble/log"
            echo "the 24.04 cross-validation did not finish within 25 minutes" >&2
            exit 1
          fi
          cat "$noble/log"
          df -h /
          exit "$(cat "$noble/exit")"

      - name: Checksums
        run: |
          set -euo pipefail
          # The deb and the zip both get a published checksum: the updater
          # refuses any asset it cannot verify.
          cd out
          for f in *.deb *.zip; do
            hash=$(sha256sum "$f" | cut -d' ' -f1)
            echo "$hash  $f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LM_LabelingTool-Linux-${{ env.LT_VERSION }}
          path: out/*
          compression-level: 0

      # Diagnostics only. Kept out of the artifact above because the release
      # job publishes everything named LM_LabelingTool-*.
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-manifest-linux-${{ env.LT_VERSION }}
          path: diag/runtime-manifest-linux.txt

  release:
    needs: [build-windows, build-linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # Needed so the gate step below can import labeling_tool.update.checker
      # -- the single source of truth for asset-name templates -- instead of
      # hand-building the same filename strings deb.py/installer.iss already
      # own (see reuse_full.py for the same reasoning), and so the release
      # page can be built from the tag's annotation.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - uses: actions/download-artifact@v4
        with:
          # Only the packages and zips: the runtime manifests are diagnostics,
          # not something to publish. No merge-multiple here on purpose --
          # each platform's artifact lands in its own
          # artifacts/<artifact-name>/ subdirectory, so the two platforms'
          # same-named SHA256SUMS.txt files do not collide before they are
          # merged below.
          pattern: LM_LabelingTool-*
          path: artifacts

      - name: Merge the two platforms' assets and checksums into one release
        run: |
          set -euo pipefail
          # The client only ever reads ONE SHA256SUMS.txt (see
          # labeling_tool/update/checker.py's SUMS_ASSET), but build-windows
          # and build-linux each produced their own. Skipping this merge
          # would leave half the assets with no published checksum, and the
          # updater would silently never offer them.
          mkdir -p out
          find artifacts -mindepth 2 -maxdepth 2 -type f ! -name 'SHA256SUMS.txt' -exec cp {} out/ \;
          # `cat a b` silently glues a's last line to b's first line if a
          # does not end in a newline. Rather than depend on every upstream
          # SHA256SUMS.txt always ending with one (the Windows job's today,
          # via Add-Content, only incidentally does), force a newline after
          # each file and drop blank lines, so a future writer that omits
          # the trailing newline cannot silently merge two checksum lines
          # into one and lose an entry. Strip CR too: PowerShell's
          # Add-Content ends the Windows lines in CRLF, and `sha256sum -c`
          # then looks for "<name>\r" (failed the v0.2.0 run 37415959330).
          : > out/SHA256SUMS.txt
          for f in artifacts/*/SHA256SUMS.txt; do
            { tr -d '\r' < "$f"; echo; } >> out/SHA256SUMS.txt
          done
          sed -i '/^$/d' out/SHA256SUMS.txt
          ls -la out/

      - name: Verify the merged checksums
        run: |
          set -euo pipefail
          # The merged file is what every client verifies against: prove
          # each line matches the file it names before anything is published.
          (cd out && sha256sum -c SHA256SUMS.txt)

      - name: Assert all four release assets, and their checksums, are present
        run: |
          set -euo pipefail
          # A build failing on one platform must never publish a release
          # carrying only the other's assets -- the client looks for one
          # exact name per platform and finds nothing, silently. And an
          # empty/truncated checksum step must not slip through either: the
          # client's find_update() skips any asset missing from
          # SHA256SUMS.txt silently (see labeling_tool/update/checker.py),
          # so a name existing in out/ is not enough -- it must also have a
          # checksum LINE, not just a present file.
          ver="${GITHUB_REF_NAME#v}"
          python -c "
          import fnmatch
          import sys
          from pathlib import Path

          sys.path.insert(0, '.')
          from labeling_tool.update import checker

          ver = sys.argv[1]
          out = Path('out')
          names = {p.name for p in out.glob('*')}
          sums_file = out / checker.SUMS_ASSET
          sums = checker.parse_sha256sums(sums_file.read_text(encoding='utf-8')) if sums_file.is_file() else {}

          exact = {
              'Windows full installer': checker.full_asset_name(ver, checker.WINDOWS),
              'Linux deb': checker.full_asset_name(ver, checker.LINUX),
          }
          # The zips carry the runtime id in their names; any id will do.
          globs = {
              'Windows update zip': checker.update_asset_name(ver, 'r*', checker.WINDOWS),
              'Linux update zip': checker.update_asset_name(ver, 'r*', checker.LINUX),
          }

          missing = []
          for label, name in exact.items():
              if name not in names:
                  missing.append(f'{label}: no file named {name}')
              elif name not in sums:
                  missing.append(f'{label}: {name} has no checksum line')
          for label, pattern in globs.items():
              matched = [n for n in names if fnmatch.fnmatch(n, pattern)]
              if not matched:
                  missing.append(f'{label}: no file matching {pattern}')
              elif not any(n in sums for n in matched):
                  missing.append(f'{label}: {matched[0]} has no checksum line')

          if missing:
              sys.exit('missing release assets or checksums:\n  ' + '\n  '.join(missing))
          print('all four release assets and their checksums are present')
          " "$ver"

      - name: Release page
        run: |
          set -euo pipefail
          # The download table, the tag's (Korean) change notes between the
          # markers the updater's dialog reads, and a guide to which file to
          # take. actions/checkout leaves a lightweight copy of the tag; the
          # annotation needs the real one.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" > notes.txt
          python packaging/release_notes.py body "${GITHUB_REF_NAME#v}" notes.txt body.md
          cat body.md

      # Uploaded as a draft, then published in one step once every asset
      # is there: /releases/latest never shows a release with half its
      # assets, which a client polling mid-upload would take as "no update".
      - name: Upload release assets to a draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*
          body_path: body.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
