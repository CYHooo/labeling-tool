# Build the Windows LabelingTool exe (lite + full) with PyInstaller.
# Triggers: manual run, version tags (v*) -> GitHub Release, and PRs that
# touch the build so packaging breakage shows up before merging.
name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/build-windows.yml"
      - "requirements*.txt"
      - "labeling_tool/**"
      - "annotation_tool/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [lite, full]
    env:
      LT_VARIANT: ${{ matrix.variant }}
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+(\.\d+)*$') {
              throw "tag '$($env:GITHUB_REF_NAME)' does not match ^v\d+(\.\d+)*$ (e.g. a '-rc1' suffix breaks VersionInfoVersion and is misclassified as a dev build)"
            }
            $ver = $env:GITHUB_REF_NAME
          } else {
            $ver = "dev-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          "LT_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install production dependencies
        run: pip install -c packaging/build-constraints.txt -r requirements-dev.txt "pyinstaller==6.22.3"

      - name: Install few-shot dependencies (full)
        if: matrix.variant == 'full'
        env:
          SAM2_BUILD_CUDA: "0"
        run: |
          pip install -c packaging/build-constraints.txt "torch==2.5.1" "torchvision==0.20.1" --index-url https://download.pytorch.org/whl/cu124
          # sam2's build needs the torch installed above (no CUDA extension: SAM2_BUILD_CUDA=0)
          pip install -c packaging/build-constraints.txt --no-build-isolation "git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4"
          python -c "import sam2.build_sam; print('few-shot imports OK')"

      - name: Tests
        run: |
          $suites = @("tests", "labeling_tool/tests")
          if ($env:LT_VARIANT -eq 'full') { $suites += "annotation_tool/tests" }
          python -m pytest @suites -q -p no:cacheprovider

      - name: Build exe
        run: pyinstaller --noconfirm --log-level WARN packaging/labeling_tool.spec

      - name: Selftest packaged exe
        run: |
          $p = Start-Process -FilePath dist\LabelingTool\LabelingTool.exe -ArgumentList "--selftest=$env:LT_VARIANT" -Wait -PassThru
          if (Test-Path dist\LabelingTool\selftest.log) {
            Get-Content dist\LabelingTool\selftest.log
            Remove-Item dist\LabelingTool\selftest.log
          } else {
            Write-Host "selftest.log not found (early crash?)"
          }
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - name: Launch smoke test (login screen stays up)
        run: |
          $p = Start-Process -FilePath dist\LabelingTool\LabelingTool.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "LabelingTool.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          # the app may create these next to the exe; never ship them
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist\LabelingTool\data, dist\LabelingTool\config.json

      - name: Write build info
        run: |
          $ver = $env:LT_VERSION -replace '^v', ''
          $info = @{ version = $ver; variant = $env:LT_VARIANT; commit = $env:GITHUB_SHA.Substring(0,7) }
          $info | ConvertTo-Json -Compress | Set-Content -Path dist\LabelingTool\build-info.json -Encoding utf8
          Get-Content dist\LabelingTool\build-info.json

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found even after installing Inno Setup" }
          # ArchitecturesAllowed=x64compatible needs Inno Setup >= 6.3, but
          # ISCC.exe's VersionInfo.ProductVersion reports 0.0.0.0 on the
          # GitHub runner image, so it cannot be asserted here. The compile
          # below is the real gate: an Inno Setup too old for
          # ArchitecturesAllowed=x64compatible fails ISCC with its own
          # explicit error, which is the loud failure we want anyway. Print
          # the banner (first lines only) so the log at least shows what
          # ran; a non-zero exit from the bare version query must not fail
          # this step.
          $ErrorActionPreference = "Continue"
          & $iscc /? 2>&1 | Select-Object -First 3 | Out-String | Write-Host
          $ErrorActionPreference = "Stop"
          $ver = $env:LT_VERSION -replace '^v', ''
          New-Item -ItemType Directory -Force out | Out-Null
          # MySource/MyOutDir must be absolute: Inno resolves relative
          # [Files] Source / OutputDir against the .iss file's own directory
          # (packaging\), not this job's working directory.
          & $iscc /DMyVariant=$env:LT_VARIANT /DMyVersion=$ver "/DMySource=$PWD\dist\LabelingTool" "/DMyOutDir=$PWD\out" packaging\installer.iss
          $setup = Get-ChildItem out\*.exe | Select-Object -First 1
          if (-not $setup) { throw "ISCC produced no installer" }
          "LT_SETUP=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # GitHub release assets must stay below 2 GiB
          if ($setup.Length -ge 1.9GB) { throw "installer too large for a release asset: $($setup.Length) bytes" }

      - name: Installer smoke test (install, selftest, uninstall)
        run: |
          $target = "$env:RUNNER_TEMP\lt-install"
          $p = Start-Process -FilePath $env:LT_SETUP -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$target","/LOG=$env:RUNNER_TEMP\install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 40; throw "install failed ($($p.ExitCode))" }
          if (-not (Test-Path "$target\build-info.json")) { throw "build-info.json missing from the install" }
          $s = Start-Process -FilePath "$target\LabelingTool.exe" -ArgumentList "--selftest=$env:LT_VARIANT" -Wait -PassThru
          if (Test-Path "$target\selftest.log") { Get-Content "$target\selftest.log" }
          if ($s.ExitCode -ne 0) { throw "installed selftest failed ($($s.ExitCode))" }
          $u = Get-ChildItem "$target\unins*.exe" | Select-Object -First 1
          Start-Process -FilePath $u.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait

      - name: Package
        run: |
          Remove-Item -Recurse -Force build
          pip cache purge
          $name = "LabelingTool-$env:LT_VARIANT-$env:LT_VERSION"
          if ($env:LT_VARIANT -eq 'lite') { 7z a -tzip "out\$name.zip" .\dist\LabelingTool }
          else { 7z a -v1900m "out\$name.7z" .\dist\LabelingTool }
          $setup = Split-Path $env:LT_SETUP -Leaf
          $hash = (Get-FileHash $env:LT_SETUP -Algorithm SHA256).Hash.ToLower()
          "$hash  $setup" | Set-Content -Path "out\SHA256SUMS-$env:LT_VARIANT.txt" -Encoding ascii
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: LabelingTool-${{ matrix.variant }}-${{ env.LT_VERSION }}
          path: out/*
          compression-level: 0

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: out

      - name: Assemble release assets
        # release runs on ubuntu-latest (bash by default), unlike the build
        # job's pwsh; rewritten to bash for the native shell here. Same
        # effect: merge the per-variant checksums into one file, drop the
        # zip/7z packaging artifacts, and publish only installers + checksums.
        run: |
          cat out/SHA256SUMS-*.txt > out/SHA256SUMS.txt
          rm -f out/*.zip out/*.7z*
          rm -f out/SHA256SUMS-*.txt
          ls -l out

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
