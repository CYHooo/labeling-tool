# Build and publish a Windows release of LM_LabelingTool.
#
# This workflow only RELEASES. Verification -- the test suite, the launch
# smoke test, the install / upgrade / uninstall smoke test and the refusal of
# a mismatched app package -- runs locally before tagging:
#
#   powershell -File packaging\ci\local-build.ps1 -Venv C:\lt\venv
#
# A CI round used to take 18-25 minutes and every failed check cost another
# round; see docs/RELEASING.md. What stays here is what a release cannot do
# without, plus one 15-second selftest so a broken bundle is never published.
#
# Triggers: a version tag (v*) builds and publishes. A manual run builds with
# fast compression and uploads the installers as a workflow artifact only --
# a dry run of the release job's input.
name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Exact: the interpreter and its DLLs are part of the runtime layer.
          python-version: "3.12.10"

      - name: Version
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+(\.\d+)*$') {
              throw "tag '$($env:GITHUB_REF_NAME)' does not match ^v\d+(\.\d+)*$ (e.g. a '-rc1' suffix breaks VersionInfoVersion and is misclassified as a dev build)"
            }
            $ver = $env:GITHUB_REF_NAME
          } else {
            $ver = "dev-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          "LT_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create a clean build environment
        run: |
          # A fresh venv, never the runner's own Python: that one ships with
          # preinstalled packages (filelock, packaging, argcomplete, ...)
          # whose versions follow the runner image, and PyInstaller bundles
          # them -- which moved the runtime id between two builds of the same
          # commit. Everything else is pinned by packaging/build-lock.txt.
          python -m venv "$env:RUNNER_TEMP\buildenv"
          "$env:RUNNER_TEMP\buildenv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install dependencies
        env:
          SAM2_BUILD_CUDA: "0"
          # sam2's repo has symlinks (sam2/sam2_hiera_*.yaml). Without this,
          # git on a machine that defaults core.symlinks=false writes 30-byte
          # placeholder files instead, and the runtime id differs from a
          # build that resolved them. Set explicitly on both sides.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.symlinks
          GIT_CONFIG_VALUE_0: "true"
        run: |
          # Every step below uses the venv (it is first on PATH now).
          if (-not ((Get-Command python).Source -like "$env:RUNNER_TEMP\buildenv\*")) { throw "not running in the build venv" }
          # Whole-array splats only: `pip install @lock -r x` would pass a
          # literal "@lock" (see the ISCC step).
          $lock = @("-m", "pip", "install", "-c", "packaging/build-constraints.txt", "-c", "packaging/build-lock.txt")
          $pipArgs = $lock + @("-r", "requirements-dev.txt", "pyinstaller==6.22.3")
          python @pipArgs
          if ($LASTEXITCODE -ne 0) { throw "installing the production dependencies failed" }
          $pipArgs = $lock + @("torch==2.5.1", "torchvision==0.20.1", "--index-url", "https://download.pytorch.org/whl/cu124")
          python @pipArgs
          if ($LASTEXITCODE -ne 0) { throw "installing torch failed" }
          # sam2's build needs the torch installed above (no CUDA extension: SAM2_BUILD_CUDA=0)
          $pipArgs = $lock + @("--no-build-isolation", "git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4")
          python @pipArgs
          if ($LASTEXITCODE -ne 0) { throw "installing sam2 failed" }

      - name: Build exe
        run: pyinstaller --noconfirm --log-level WARN packaging/labeling_tool.spec

      - name: Selftest packaged exe
        run: |
          # The one check kept in CI: 15 seconds, and it stops a bundle that
          # cannot import torch or compose the sam2 config from being published.
          . packaging/ci/bounded.ps1
          $code = Invoke-Bounded -Path dist\LM_LabelingTool\LM_LabelingTool.exe `
            -CallArgs @("--selftest=full") -TimeoutSec 300 -What "selftest on the build output"
          if (Test-Path dist\LM_LabelingTool\selftest.log) {
            Get-Content dist\LM_LabelingTool\selftest.log
            Remove-Item dist\LM_LabelingTool\selftest.log
          } else {
            Write-Host "selftest.log not found (early crash?)"
          }
          if ($code -ne 0) { throw "selftest failed with exit code $code" }
          # the app may create these next to the exe; never ship them
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist\LM_LabelingTool\data, dist\LM_LabelingTool\config.json

      - name: Compute the runtime id and write build info
        run: |
          # The runtime id measures the runtime layer itself -- each file's
          # path and size, minus the build machine's own system DLLs. It must
          # match what local-build.ps1 printed for the same commit; if it
          # does not, the lock or the environment has drifted.
          $rt = python packaging/layers.py runtime-id dist/LM_LabelingTool
          if (-not ($rt -match '^r[0-9a-f]{8}$')) { throw "bad runtime id: $rt" }
          "LT_RUNTIME=$rt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "runtime id: $rt"
          # What the id hashes, file by file, for diffing against a local build.
          New-Item -ItemType Directory -Force diag | Out-Null
          python packaging/layers.py manifest dist/LM_LabelingTool | Set-Content -Path diag\runtime-manifest.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "could not write the runtime manifest" }
          $ver = $env:LT_VERSION -replace '^v', ''
          $info = @{ version = $ver; variant = 'full'; runtime = $rt; commit = $env:GITHUB_SHA.Substring(0,7) }
          $info | ConvertTo-Json -Compress | Set-Content -Path dist\LM_LabelingTool\build-info.json -Encoding utf8
          Get-Content dist\LM_LabelingTool\build-info.json

      - name: Stage the app layer
        run: |
          python packaging/layers.py stage dist/LM_LabelingTool dist/app-layer
          if ($LASTEXITCODE -ne 0) { throw "staging the app layer failed" }
          $app = (Get-ChildItem dist/app-layer -Recurse -File | Measure-Object -Property Length -Sum)
          Write-Host ("app layer: {0:N1} MB in {1} files" -f ($app.Sum/1MB), $app.Count)
          # The app package is what every routine update downloads. If it
          # climbs back into the tens of MB something leaked out of the
          # runtime layer.
          if ($app.Sum -gt 20MB) { throw ("app layer unexpectedly large: {0:N1} MB" -f ($app.Sum/1MB)) }

      - name: Build installers
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found even after installing Inno Setup" }
          $ver = $env:LT_VERSION -replace '^v', ''
          # Windows version resources must be numeric (x.y[.z[.w]]). For dev
          # builds ($ver like "dev-a72cd7b"), use 0.0.0.
          if ($ver -match '^\d+(\.\d+)*$') { $infoVer = $ver } else { $infoVer = '0.0.0' }
          New-Item -ItemType Directory -Force out | Out-Null
          # Splatting only expands when it IS the whole argument list --
          # `& $iscc /A @fast script.iss` passes a literal "@fast", which
          # ISCC reads as a second script filename and rejects.
          $common = @("/DMyVersion=$ver", "/DMyVersionInfo=$infoVer",
                      "/DMySourceRoot=$PWD", "/DMyRuntime=$env:LT_RUNTIME")
          # Tags are what users download: maximum compression. A manual dry
          # run only needs to show that the release would build.
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            $common += "/DMyFast=1"
            Write-Host "dry run: fast compression"
          }
          # MySource/MyOutDir must be absolute: Inno resolves relative paths
          # against the .iss file's own directory (packaging\).
          $isccArgs = @("/DMyLayer=full", "/DMySource=$PWD\dist\LM_LabelingTool",
                        "/DMyOutDir=$PWD\out") + $common + @("packaging\installer.iss")
          & $iscc @isccArgs
          if ($LASTEXITCODE -ne 0) { throw "full installer failed ($LASTEXITCODE)" }
          $isccArgs = @("/DMyLayer=app", "/DMySource=$PWD\dist\app-layer",
                        "/DMyOutDir=$PWD\out") + $common + @("packaging\installer.iss")
          & $iscc @isccArgs
          if ($LASTEXITCODE -ne 0) { throw "app installer failed ($LASTEXITCODE)" }
          $full = Get-ChildItem out\LM_LabelingTool-Setup-*.exe | Select-Object -First 1
          $app  = Get-ChildItem out\LM_LabelingTool-App-*.exe   | Select-Object -First 1
          if (-not $full) { throw "ISCC produced no full installer" }
          if (-not $app)  { throw "ISCC produced no app installer" }
          Get-ChildItem out\*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB) }
          # GitHub release assets must stay below 2 GiB. Only tag builds are
          # published, and only they use maximum compression.
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $full.Length -ge 1.9GB) {
            throw "installer too large for a release asset: $($full.Length) bytes"
          }

      - name: Assert the asset names match what the client looks for
        run: |
          # installer.iss's OutputBaseFilename and checker.py's templates are
          # one contract; change either alone and the client silently stops
          # finding updates.
          $ver = $env:LT_VERSION -replace '^v', ''
          $names = (Get-ChildItem out\*.exe | ForEach-Object { $_.Name }) -join ","
          python -c "import sys; from labeling_tool.update import checker; ver, rt, names = sys.argv[1], sys.argv[2], set(sys.argv[3].split(',')); [sys.exit(f'{w!r} not in {sorted(names)}') for w in (checker.full_asset_name(ver), checker.app_asset_name(ver, rt)) if w not in names]; print('asset names agree with checker.py')" $ver $env:LT_RUNTIME $names
          if ($LASTEXITCODE -ne 0) { throw "asset names do not match checker.py" }

      - name: Checksums
        run: |
          # both installers get a published checksum: the updater refuses any
          # asset it cannot verify
          Get-ChildItem out\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content -Path "out\SHA256SUMS.txt" -Encoding ascii
          }
          Get-Content out\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LM_LabelingTool-${{ env.LT_VERSION }}
          path: out/*
          compression-level: 0

      # Diagnostics only. Kept out of the artifact above because the release
      # job publishes everything named LM_LabelingTool-*.
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-manifest-${{ env.LT_VERSION }}
          path: diag/runtime-manifest.txt

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Only the installers: the runtime manifest is a diagnostic, not
          # something to publish.
          pattern: LM_LabelingTool-*
          merge-multiple: true
          path: out

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
